name: Release App

# Builds the Dissonance desktop app on each platform's native runner
# (electron-builder can't cross-build installers) and publishes them to a
# single GitHub release. Triggered by pushing a v* tag; workflow_dispatch
# builds the installers as artifacts without publishing, for testing.
#
# The platform-native core addon (.node) is expected to already be committed
# under Build/Release/ (kept current by sync-core-addon.yml). The macOS build
# is Apple Silicon (arm64) only — matches the single darwin-arm64 addon the
# core repo ships.

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    # Only the macOS leg sets it; empty outputs from the other legs are dropped.
    outputs:
      mac_signed: ${{ steps.mac_build.outputs.signed }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            artifact_glob: |
              dist/*.dmg
              dist/*.zip
          - os: windows
            # Pinned to windows-2022 for the same reason the core repo pins it:
            # windows-latest (2025) ships a VS version older toolchains trip on.
            runner: windows-2022
            artifact_glob: |
              dist/*.exe
          - os: linux
            runner: ubuntu-latest
            artifact_glob: |
              dist/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build distributables
        if: matrix.os != 'macos'
        run: npm run dist

      # Signs with the Developer ID certificate and notarizes with an App Store
      # Connect API key. See "Signing and notarizing macOS releases" in
      # CONTRIBUTING.md for the secrets. Without them, a final tag fails; a
      # release-candidate tag (vX.Y.Z-rc.N) builds unsigned for testers.
      - name: Build, sign and notarize distributables (macOS)
        id: mac_build
        if: matrix.os == 'macos'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          IS_RC: ${{ contains(github.ref_name, '-rc') }}
        run: |
          missing=()
          [ -n "$CSC_LINK" ] || missing+=(CSC_LINK)
          [ -n "$CSC_KEY_PASSWORD" ] || missing+=(CSC_KEY_PASSWORD)
          [ -n "$APPLE_API_KEY_P8" ] || missing+=(APPLE_API_KEY)
          [ -n "$APPLE_API_KEY_ID" ] || missing+=(APPLE_API_KEY_ID)
          [ -n "$APPLE_API_ISSUER" ] || missing+=(APPLE_API_ISSUER)

          if [ ${#missing[@]} -gt 0 ]; then
            if [ "$IS_TAG" = true ] && [ "$IS_RC" != true ]; then
              echo "::error::Missing macOS signing secret(s): ${missing[*]}. A final release tag build must be signed and notarized: add them in Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "::warning::Missing macOS signing secret(s): ${missing[*]}. Building an unsigned (ad-hoc) app."
            # electron-builder treats an empty variable as set, so drop them all.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
          else
            # electron-builder wants APPLE_API_KEY to be the path of the .p8 file.
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
            unset APPLE_API_KEY_P8
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

          npm run dist

      # The app is what gets notarized and stapled; the dmg and zip wrap it.
      # spctl uses -t exec because -t install is for .pkg installers. If the
      # runner has Gatekeeper assessments disabled, spctl accepts anything
      # with an "override" source; stapler validate still proves notarization.
      - name: Verify macOS signature and notarization
        if: steps.mac_build.outputs.signed == 'true'
        run: |
          app="dist/mac-arm64/Dissonance.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          assessment=$(spctl -a -vvv -t exec "$app" 2>&1) || { echo "$assessment"; exit 1; }
          echo "$assessment"
          if ! grep -q "source=Notarized Developer ID" <<< "$assessment"; then
            if grep -q "override" <<< "$assessment"; then
              echo "::warning::Gatekeeper assessments are disabled on this runner; relying on stapler validate."
            else
              echo "::error::Gatekeeper does not see the app as notarized."
              exit 1
            fi
          fi
          xcrun stapler validate "$app"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Bare file names, so `sha256sum -c` works next to the downloaded assets.
      # SHA256SUMS.txt sits in artifacts/ itself, so */* never hashes it.
      - name: Write SHA256 checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          files=(*/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::No release files to checksum."; exit 1; }
          for f in "${files[@]}"; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dissonance ${{ github.ref_name }}
          # vX.Y.Z-rc.N is a release candidate for testers.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: artifacts/**/*
          body: |
            Multi-platform Dissonance desktop app.

            ## Assets
            - `*.dmg` / `*.zip` — macOS (Apple Silicon)
            - `*.exe` — Windows (x64) installer
            - `*.AppImage` — Linux (x64)

            Bundles the core audio addon with the current psychoacoustic
            masking model.

            ## Notes
            - ${{ needs.build.outputs.mac_signed == 'true' && 'The macOS build is signed and notarized by Apple.' || 'This release candidate''s macOS build is unsigned: right-click the app → Open on first launch, or run `xattr -cr /Applications/Dissonance.app`.' }}
            - The Windows and Linux builds are unsigned: Windows SmartScreen
              warns on first launch (More info → Run anyway).
            - macOS is Apple Silicon only; no Intel build.
            - To verify a download, put `SHA256SUMS.txt` next to it and run
              `sha256sum -c --ignore-missing SHA256SUMS.txt`
              (macOS: `shasum -a 256 -c --ignore-missing SHA256SUMS.txt`).
