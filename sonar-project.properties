# SonarQube Cloud analysis of ui (docs#78).
# Run by .github/workflows/ui-quality-checks.yml, only when the SONAR_TOKEN
# secret is set. Setup and quality gate: planning/sonarqube-setup.md in the docs repo.

sonar.organization=dissonance-eip
sonar.projectKey=Dissonance-Eip_ui
sonar.projectName=ui

sonar.sources=main.js,preload.js,index.html,main,ipcHandlers,renderer
sonar.tests=tests
sonar.sourceEncoding=UTF-8
# Build output, dependencies, generated CSS, the prebuilt core addon and any
# minified vendor bundle.
sonar.exclusions=dist/**,node_modules/**,coverage/**,Build/**,tailwind.css,**/*.min.js

# Written by `npm run test:coverage` (Vitest, V8 provider, lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
